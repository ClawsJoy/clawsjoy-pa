# version: 2.0.0 - 光影引擎升级版
name: text_process
description: 文本处理工作流 - 分析+优化+翻译
version: 2.0.0

steps:
  - name: analyze
    agent: analysis_agent
    prompt: "分析文本内容: {text}"
    output: analysis
  
  - name: optimize
    agent: writer_agent
    prompt: "优化文本: {text}"
    output: optimized
  
  - name: translate
    agent: translate_agent
    prompt: "翻译文本: {optimized} 目标语言: {target_lang}"
    output: translated
    optional: true

output:
  - analysis
  - optimized
  - translated
