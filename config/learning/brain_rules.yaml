version: "2.0.0"

priority:
  - name: math
    keywords: ["计算", "加", "减", "乘", "除", "+", "-", "*", "/"]
    pattern: '(\d+)\s*([+\-*/xX])\s*(\d+)'
    handler: "math_executor"

  - name: workflow
    keywords: ["图片", "识别", "视频", "制作", "翻译"]
    handler: "workflow_executor"

  - name: hermes
    keywords: ["帮我", "分析", "生成", "写", "创作", "复杂", "多个步骤", "然后", "接着"]
    handler: "hermes_executor"
    description: "Hermes 智能体 - 任务分解、工具调用、自我反思"

  - name: llm
    keywords: []
    handler: "llm_executor"
    default: true

executors:
  math_executor:
    module: "core.executors.math_executor"
    class: "math_executor"
    enabled: true

  workflow_executor:
    module: "core.executors.workflow_executor"
    class: "workflow_executor"
    enabled: true

  hermes_executor:
    module: "core.agents.builtin.hermes_executor"
    class: "hermes_executor"
    enabled: true

  llm_executor:
    module: "core.executors.llm_executor"
    class: "llm_executor"
    enabled: true
