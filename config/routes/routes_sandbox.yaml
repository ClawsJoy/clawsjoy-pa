# 沙箱和本地Agent路由配置
routes:
  - path: "/api/local/agents"
    method: "GET"
    handler: "local_agent_list"
    enabled: true
    description: "列出本地Agent"
    
  - path: "/api/local/call"
    method: "POST"
    handler: "local_agent_call"
    enabled: true
    description: "调用本地Agent"
    
  - path: "/api/local/register"
    method: "POST"
    handler: "local_agent_register"
    enabled: true
    description: "注册本地Agent"
    
  - path: "/api/sandbox/agents"
    method: "GET"
    handler: "sandbox_list"
    enabled: true
    description: "列出沙箱Agent"
    
  - path: "/api/sandbox/call"
    method: "POST"
    handler: "sandbox_call"
    enabled: true
    description: "调用沙箱Agent"
    
  - path: "/api/sandbox/destroy"
    method: "POST"
    handler: "sandbox_destroy"
    enabled: true
    description: "销毁沙箱实例"
