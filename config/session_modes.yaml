# 会话模式配置
# 加新模式只需在此文件添加，不需要改任何代码

version: "1.0.0"

modes:
  # 方言相关
  dialect_training:
    keywords: ["方言训练", "教方言", "方言学习"]
    agent: "dialect_agent"
    exit_keywords: ["退出", "结束", "停止", "关闭"]
    
  dialect_practice:
    keywords: ["方言练习", "练方言"]
    agent: "dialect_agent"
    exit_keywords: ["退出", "结束", "停止", "关闭"]
    
  dialect_dialogue:
    keywords: ["讲方言", "方言对话", "方言模式"]
    agent: "dialect_agent"
    exit_keywords: ["退出", "结束", "停止", "关闭"]

