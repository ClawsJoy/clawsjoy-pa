name: file_agent
description: 文件管理专家
capabilities:
  - name: read_file
    description: 读取文件内容
  - name: write_file
    description: 写入或创建文件
  - name: list_files
    description: 列出目录中的文件
  - name: delete_file
    description: 删除文件
  - name: search_files
    description: 搜索文件
examples:
  - input: "读取 test.txt"
    output: "返回 test.txt 的内容"
  - input: "列出文件"
    output: "📁 目录中的文件列表"
