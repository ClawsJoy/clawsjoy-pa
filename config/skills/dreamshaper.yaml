name: dreamshaper_text2img
type: atomic
version: 1.0.0
description: 基于 DreamShaper XL 的高质量文本生成图像原子技能
category: image
author: ClawsJoy
compatible_with:
  - openclaw
  - clawsjoy
tags:
  - image-generation
  - text-to-image
  - dreamshaper
  - stable-diffusion

input_schema:
  prompt:
    type: string
    required: true
    description: 图像描述提示词
    example: "A beautiful sunset over mountains, digital art, 4k"
  negative_prompt:
    type: string
    required: false
    default: "low quality, blurry, ugly"
    description: 负面提示词
  steps:
    type: integer
    required: false
    default: 15
    minimum: 1
    maximum: 50
    description: 推理步数
  width:
    type: integer
    required: false
    default: 768
    description: 图像宽度
  height:
    type: integer
    required: false
    default: 768
    description: 图像高度
  cfg:
    type: number
    required: false
    default: 7.5
    description: 引导系数

output_schema:
  success:
    type: boolean
    description: 是否成功
  image_path:
    type: string
    description: 图片路径
  elapsed_time:
    type: number
    description: 耗时(秒)

examples:
  - input:
      prompt: "A beautiful sunset over mountains"
      steps: 15
    description: "生成日落风景"
  - input:
      prompt: "一只可爱的猫咪"
      steps: 12
    description: "中文提示词测试"

execution:
  runtime: python3
  entry: ./tools/dreamshaper_skill.py
  command_template: "python3 {entry} --prompt '{input.prompt}' --steps {input.steps} --width {input.width} --height {input.height} --cfg {input.cfg} --json"
