# 监控配置
monitoring:
  health_check:
    interval: 60
    timeout: 5
    services:
      - name: gateway
        port: 5002
        health_path: /api/health
      - name: multi_agent
        port: 5006
        health_path: /health
      - name: comfyui
        port: 8188
        health_path: /

  success_monitor:
    interval: 300
    target_rate: 50
    warning_threshold: 40
    critical_threshold: 30
    window_size: 20

  alerter:
    channels:
      - console
      - log
    max_alerts_per_hour: 10

  performance:
    metrics:
      - cpu
      - memory
      - disk
    collection_interval: 60
