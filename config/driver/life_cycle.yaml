# 生命闭环配置 v1.1.0

# 感知层配置
perception:
  name_patterns:
    - "^[我][叫][\\s]*([^\\s，。]{2,4})$"
    - "^[我][是][\\s]*([^\\s，。]{2,4})$"
  preference_patterns:
    - "喜欢[\\s]*([^，。]{2,8})$"
  excluded_words:
    - "什么"
    - "谁"
    - "怎么"
    - "为什么"

# 记忆层配置
memory:
  short_term_max: 20          # 短期记忆最大数量
  long_term_max: 100          # 长期记忆最大数量
  dream_promote_min_length: 20    # 梦境晋升最小长度
  dream_promote_keywords:     
    - "?"
    - "叫"
    - "喜欢"
    - "Agent"
    - "系统"

# 思考层配置
thinking:
  rule_first: true            
  llm_timeout: 20             
  llm_temperature: 0.3        
  llm_max_tokens: 100         

# 反思层配置
reflection:
  interval: 5                 # 每 N 次交互反思一次
  quality_thresholds:
    excellent: 0.8            # 优秀阈值
    good: 0.5                 # 良好阈值
    low: 0.3                  # 偏低阈值
  quality_weights:
    length: 0.2
    content: 0.2
    no_template: 0.1

# 梦境层配置
dreaming:
  interval: 10                # 每 N 次交互梦境一次
  short_term_max: 20          # 短期记忆上限
  long_term_max: 100          # 长期记忆上限
  promote_conditions:
    min_length: 20
    has_keyword: true
  priority_keywords:          
    - "叫"
    - "喜欢"
    - "Agent"

# 学习层配置
learning:
  auto_save: true
  evolution_interval: 20      # 每 N 次交互进化一次
