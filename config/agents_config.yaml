# Agent 配置
decision_agent:
  routes:
    A: "chat_agent"
    B: "executor_agent"
    C: "orchestrator"
  
  keywords:
    translate: ["翻译", "Translate"]
    calculate: ["+", "-", "*", "/", "加", "减", "乘", "除"]
    code: ["写代码", "编程", "函数", "算法"]

chat_agent:
  templates:
    identity: "我是 ClawsJoy 助手，您的智能助手！🎉"
    about: "ClawsJoy 是一个智能体操作系统！🎯"
    greeting: "您好！很高兴为您服务！✨"
    thanks: "不客气！很高兴能帮到您！😊"
    farewell: "再见！欢迎随时回来！👋"
    capabilities: "我可以帮您查天气、翻译方言、计算、回答问题、生成代码。"
