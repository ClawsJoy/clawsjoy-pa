# 系统基础能力配置（只读，用户不可修改）
# 所有用户共享此基础能力

version: "4.0.0"

system_skills:
  language_master:
    base_config:
      translation_style: "concise"
      auto_learn: true
    readonly: true
    description: "系统级翻译能力，不可修改"
  
  video_maker:
    base_config:
      output_format: "mp4"
      resolution: "1920x1080"
      fps: 30
    readonly: true
  
  image_processor:
    base_config:
      default_width: 512
      default_height: 512
    readonly: true

system_agents:
  personal_butler:
    base_config:
      greeting_style: "warm"
      response_style: "concise"
      memory_retention_days: 30
    readonly: true
  
  chat_agent:
    base_config:
      max_history: 10
      ttl: 300
    readonly: true

security:
  max_custom_vocab: 100
  max_installed_skills: 50
  max_private_memory: 10000

features:
  auto_learn: true
  vector_search: false
  offline_mode: true

