# ClawsJoy 生产配置
version: "5.0.0"

server:
  host: "0.0.0.0"
  port: 5002
  workers: 4
  reload: false

llm:
  provider: "ollama"
  model: "qwen2.5:7b-instruct-q4_0-gpu"
  embedding_model: "nomic-embed-text"
  temperature: 0.7
  timeout: 60

vector_store:
  type: "chromadb"
  persist_directory: "data/chroma"
  collection_name: "memories"

cache:
  type: "redis"
  url: "redis://localhost:6379"
  ttl: 3600

memory:
  short_term_limit: 50
  long_term_limit: 500

logging:
  level: "INFO"
  format: "json"
