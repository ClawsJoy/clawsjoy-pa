# 决策评估配置
version: "2.0.0"

# 风险评估
risk:
  levels:
    high:
      keywords: ["删除", "清空", "重置", "kill", "停止", "关闭", "销毁"]
      action: "block"
      require_confirm: true
    medium:
      keywords: ["修改", "更新", "变更", "迁移", "配置", "调整", "重启", "重载", "刷新"]
      action: "gray"           # 灰度执行
      require_confirm: false
    low:
      keywords: ["查看", "查询", "获取", "列出", "搜索", "健康", "状态", "日志", "技能", "Agent", "列表", "信息"]
      action: "allow"
      require_confirm: false

# 执行策略
execution:
  auto_execute_levels: ["low"]
  gray_execute_levels: ["medium"]
  block_levels: ["high"]
  max_retries: 2
  timeout: 30

# 灰度执行配置
gray:
  enabled: true
  percentage: 20           # 20% 流量
  monitoring_time: 60      # 监控60秒
  rollback_on_error: true
  success_threshold: 0.95  # 成功率 > 95% 才全量
  sample_size: 10          # 至少10个样本

# 回滚配置
rollback:
  enabled: true
  auto_rollback: true
  check_interval: 5
  metrics:
    - "error_rate"
    - "response_time"
    - "success_rate"
  
# 历史学习
learning:
  enabled: true
  history_size: 500
  confidence_threshold: 0.6
  min_samples: 3
