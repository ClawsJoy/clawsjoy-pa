# 思维链推理配置
version: "1.0.0"

enabled: true

# 思考模板
templates:
  general: |
    请一步步思考：
    1. 理解用户问题：{question}
    2. 分析关键信息：
    3. 推理过程：
    4. 最终回答：
    
    请按以上步骤思考后回答。

  math: |
    让我们一步步计算：
    1. 已知条件：
    2. 计算公式：
    3. 计算过程：
    4. 最终答案：

  code: |
    分析代码问题：
    1. 问题描述：
    2. 错误原因：
    3. 解决方案：
    4. 修复代码：

  decision: |
    决策分析：
    1. 目标：
    2. 可选方案：
    3. 利弊分析：
    4. 推荐选择：

# 触发条件
triggers:
  math_keywords: ["计算", "等于", "求和", "平均值", "百分比"]
  code_keywords: ["代码", "bug", "错误", "调试", "修复"]
  decision_keywords: ["选择", "决定", "哪个更好", "建议"]
