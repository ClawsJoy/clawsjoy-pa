# 意图路由配置 - 精简版
intents:
  - name: "health"
    route: "/api/health"
    sentences:
      - "检查系统健康状态"
      - "系统健康检查"
      
  - name: "skills"
    route: "/api/skills"
    sentences:
      - "获取技能列表"
      - "有哪些技能"
      
  - name: "send_message"
    route: "/api/agents/send"
    sentences:
      - "发送消息给Agent"
      - "和智能体对话"
      
  - name: "do_anything"
    route: "/api/agent/v3/do_anything"
    sentences:
