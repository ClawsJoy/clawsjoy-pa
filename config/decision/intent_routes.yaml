      - "帮我处理"
      
  - name: "logs"
    route: "/api/logs"
    sentences:
      - "查看系统日志"
      
  - name: "error_logs"
    route: "/api/logs/errors"
    sentences:
      - "查看错误日志"
      - "查看异常记录"
      
  - name: "metrics"
    route: "/metrics"
    sentences:
      - "查看性能指标"
      - "查看监控数据"
      
  - name: "broadcast"
    route: "/api/agents/broadcast"
    sentences:
      - "广播消息"
      
  - name: "agents_list"
    route: "/api/agents/list"
    sentences:
      - "查看Agent列表"
