# ============================================
# 多租户注册表 - 隔离配置
# ============================================
version: "1.0.0"

tenants:
  default:
    id: "default"
    name: "默认租户"
    created_at: "2026-01-01"
    status: "active"
    quota:
      max_developers: 100
      max_skills: 500
      max_api_calls_per_day: 10000
    
  enterprise_demo:
    id: "enterprise_demo"
    name: "企业演示租户"
    created_at: "2026-05-24"
    status: "active"
    quota:
      max_developers: 20
      max_skills: 100
      max_api_calls_per_day: 5000

# 租户隔离规则
isolation_rules:
  - type: "data"
    description: "数据存储隔离: data/tenants/{tenant_id}/"
  - type: "api"
    description: "API密钥隔离: 每个租户独立密钥"
  - type: "skill"
    description: "技能隔离: 租户内技能互不可见"

# API 热加载配置
hot_reload:
  enabled: true
  check_interval: 5  # 秒
  skill_path: "data/tenants/{tenant_id}/skills/"
  auto_register: true
