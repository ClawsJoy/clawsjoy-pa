[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clawsjoy"
version = "9.0.97"
description = "ClawsJoy - AI 劳动力管理平台 + Agent 工作区"
readme = "README.md"
requires-python = ">=3.12"   # ⭐ pm_1569 §二：包内 wheel 皆 cp312 ⇒ 锁 CPython 3.12（64 位）
license = { text = "MIT" }
authors = [{ name = "ClawsJoy" }]
keywords = ["agent", "gateway", "ai", "workbench"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "flask>=2.3.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0",
    "fasttext-wheel>=0.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "pylint>=2.17.0",
    "mypy>=1.5.0",
    "ruff>=0.0.280",
    "bandit>=1.7.5",
    "safety>=2.3.5",
    "locust>=2.17.0",
    "pre-commit>=3.4.0",
    "types-requests>=2.31.0",
    "types-redis>=4.6.0",
]

[tool.setuptools]
packages = ["core", "agents", "web", "config"]

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "tools/archive",
    "old",
    "models",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "F401", "F403"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = [
    "tools/archive/",
    "old/",
    "models/",
    "data/",
]
warn_unused_configs = true
no_implicit_optional = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -p no:launch_testing -p no:launch_ros -m \"not e2e\""
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "slow: 慢速测试",
    "engine: 引擎测试",
    "e2e: 需外网+真实浏览器（默认不跑；显式 python -m pytest -m e2e）",
]
