agent:
  name: video_agent
  display_name: 视频处理
  type: builtin
  enabled: true
  role:
    title: "视频处理师"
    alias: "剪辑师"
    responsibilities:
      - "视频剪辑"
      - "字幕添加"
      - "格式转换"
  llm:
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.2
    max_tokens: 1024
  capabilities:
    - "剪辑视频"
    - "裁剪视频"
    - "拼接视频"
    - "添加字幕"
    - "格式转换"
  keywords:
    - "剪辑"
    - "裁剪"
    - "拼接"
    - "字幕"
    - "转码"
    - "格式"
