agent:
  name: decision_agent
  display_name: 决策师
  type: builtin
  enabled: true
  role:
    title: "决策师"
    alias: "指挥官"
    level: 3
    responsibilities:
      - "分析复杂问题"
      - "评估多个方案"
      - "做出最优决策"
      - "风险分析"
    permissions:
      - "read_all_data"
      - "delegate_tasks"

  # LLM 配置 - 决策需要强推理能力
  llm:
    provider: ollama
    model: qwen2.5:7b
    temperature: 0.2
    max_tokens: 2048
    timeout: 90

  # 能力声明
  capabilities:
    - decision_making
    - risk_analysis
    - option_evaluation
    - strategic_planning

routing:
  rules:
    - patterns: ["你好", "hi", "hello", "您好"]
      action: "respond"
      response: "您好！我是决策师，有什么可以帮您？"
    - patterns: ["计算", "加", "减", "乘", "除", "数学"]
      action: "delegate"
      target: "executor_agent"
    - patterns: ["代码", "编程", "写"]
      action: "delegate"
      target: "code_agent"
    - patterns: ["决策", "选择", "哪个更好", "建议", "方案"]
      action: "respond"
  default_action: "respond"
  default_response: "我可以帮您分析问题和提供建议。"

memory:
  enabled: true
  path: memory/

# 决策权重配置
weights:
  analyst: 0.45
  semantic: 0.20
  llm: 0.20
  historical: 0.10
  heuristic: 0.05
