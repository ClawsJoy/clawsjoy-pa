# 方言配置 - 可扩展
version: "1.0.0"

supported_dialects:
  - name: "普通话"
    code: "zh-cn"
    enabled: true
  - name: "粤语"
    code: "yue"
    enabled: true
  - name: "闽南语"
    code: "nan"
    enabled: true
  - name: "吴语"
    code: "wuu"
    enabled: true
