version: "3.8"

# ──────────────────────────────────────────────
# ClawsJoy Platform — 基础设施服务
# 不包含应用服务，本地开发时由开发者自行启动
# ──────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ──
  postgres:
    image: postgres:16-alpine
    container_name: clawsjoy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clawsjoy
      POSTGRES_PASSWORD: clawsjoy_secret
      POSTGRES_DB: clawsjoy_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawsjoy -d clawsjoy_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    container_name: clawsjoy-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NATS ──
  nats:
    image: nats:2-alpine
    container_name: clawsjoy-nats
    restart: unless-stopped
    ports:
      - "4222:4222"  # 客户端连接
      - "8222:8222"  # HTTP 监控
    command:
      - "--http_port=8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
