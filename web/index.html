<!DOCTYPE html>
<html lang="zh-CN">
<head><link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawsJoy 智能体AI系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', monospace;
            background: #0a0a1a;
            color: #e0e0ff;
            overflow: hidden;
        }
        .app {
            height: 100vh;
            background-image: linear-gradient(rgba(0,243,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,243,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 15px 20px;
            background: rgba(10,10,26,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,243,255,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00f3ff, #7b2ff7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav {
            display: flex;
            gap: 20px;
        }
        .nav a {
            color: #a0a0ff;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .nav a:hover {
            background: rgba(0,243,255,0.1);
            color: #00f3ff;
        }
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: rgba(10,10,26,0.7);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0,243,255,0.1);
            padding: 20px;
            overflow-y: auto;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.3);
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
        }
        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #00f3ff20, #7b2ff720);
            border: 1px solid rgba(0,243,255,0.3);
        }
        .butler-message {
            align-self: flex-start;
            background: rgba(123,47,247,0.15);
            border: 1px solid rgba(123,47,247,0.3);
        }
        .input-area {
            padding: 20px;
            border-top: 1px solid rgba(0,243,255,0.1);
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,243,255,0.2);
            border-radius: 8px;
            color: #e0e0ff;
            font-size: 14px;
        }
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00f3ff, #7b2ff7);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .status {
            font-size: 12px;
            color: #888;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">🤖 ClawsJoy</div>
        <div class="nav">
            <a href="#" onclick="switchPage('chat')">💬 管家</a>
            <a href="#" onclick="switchPage('club')">🏆 俱乐部</a>
            <a href="#" onclick="switchPage('skills')">🔧 技能</a>
            <a href="#" onclick="switchPage('marketplace')">📦 市场</a>
        </div>
        <div class="status" id="status">🟢 在线</div>
    </div>
    <div class="main">
        <!-- 聊天页面 -->
        <div id="chatPage" class="chat-area" style="display: flex;">
            <div class="messages" id="messages">
                <div class="message butler-message">👋 您好！我是您的私人管家，有什么可以帮您的吗？</div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="if(event.keyCode===13) sendMessage()">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
        <!-- 俱乐部页面 -->
        <div id="clubPage" class="chat-area" style="display: none; padding: 20px; overflow-y: auto;">
            <div class="card">
                <h3>🏆 俱乐部统计</h3>
                <div id="clubStats">加载中...</div>
            </div>
        </div>
        <!-- 技能页面 -->
        <div id="skillsPage" class="chat-area" style="display: none; padding: 20px; overflow-y: auto;">
            <div class="card">
                <h3>🔧 技能列表</h3>
                <div id="skillsList">加载中...</div>
            </div>
        </div>
        <!-- 市场页面 -->
        <div id="marketplacePage" class="chat-area" style="display: none; padding: 20px; overflow-y: auto;">
            <div class="card">
                <h3>📦 技能市场</h3>
                <div id="marketplaceList">加载中...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // API 配置
    const API_BASE = 'http://localhost:5002';
    let currentUser = localStorage.getItem('clawsjoy_user') || 'user_' + Math.random().toString(36).substr(2, 8);
    
    // 页面切换
    function switchPage(page) {
        document.getElementById('chatPage').style.display = page === 'chat' ? 'flex' : 'none';
        document.getElementById('clubPage').style.display = page === 'club' ? 'flex' : 'none';
        document.getElementById('skillsPage').style.display = page === 'skills' ? 'flex' : 'none';
        document.getElementById('marketplacePage').style.display = page === 'marketplace' ? 'flex' : 'none';
        
        if (page === 'club') loadClubStats();
        if (page === 'skills') loadSkills();
        if (page === 'marketplace') loadMarketplace();
    }
    
    // 发送消息
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message) return;
        
        // 添加用户消息
        addMessage(message, 'user');
        input.value = '';
        
        try {
            const response = await fetch(`${API_BASE}/api/butler/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUser, message: message })
            });
            const data = await response.json();
            addMessage(data.response || '抱歉，我遇到了一些问题', 'butler');
        } catch (error) {
            addMessage('网络错误，请确保后端服务已启动', 'butler');
        }
    }
    
    function addMessage(text, role) {
        const messagesDiv = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role === 'user' ? 'user-message' : 'butler-message'}`;
        msgDiv.textContent = text;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    // 加载俱乐部统计
    async function loadClubStats() {
        try {
            const response = await fetch(`${API_BASE}/api/butler/club/stats`);
            const data = await response.json();
            const stats = data.stats || {};
            document.getElementById('clubStats').innerHTML = `
                <p>📊 总会员: ${stats.total_members || 0}</p>
                <p>🤝 总交互: ${stats.total_interactions || 0}</p>
                <p>🏅 等级分布: ${JSON.stringify(stats.level_distribution || {})}</p>
            `;
        } catch (error) {
            document.getElementById('clubStats').innerHTML = '<p>加载失败</p>';
        }
    }
    
    // 加载技能列表
    async function loadSkills() {
        try {
            const response = await fetch(`${API_BASE}/api/skills`);
            const data = await response.json();
            const skills = data.skills || data || {};
            const skillNames = Object.keys(skills).slice(0, 20);
            document.getElementById('skillsList').innerHTML = `
                <p>📚 共 ${Object.keys(skills).length} 个技能</p>
                <ul>${skillNames.map(s => `<li>${s}</li>`).join('')}</ul>
                ${Object.keys(skills).length > 20 ? '<p>...</p>' : ''}
            `;
        } catch (error) {
            document.getElementById('skillsList').innerHTML = '<p>加载失败</p>';
        }
    }
    
    // 加载市场
    async function loadMarketplace() {
        document.getElementById('marketplaceList').innerHTML = '<p>技能市场开发中...</p>';
    }
    
    // 健康检查
    async function checkHealth() {
        try {
            const response = await fetch(`${API_BASE}/api/health`);
            const data = await response.json();
            document.getElementById('status').innerHTML = '🟢 在线';
        } catch (error) {
            document.getElementById('status').innerHTML = '🔴 离线';
        }
    }
    
    // 初始化
    checkHealth();
    setInterval(checkHealth, 30000);
</script>
</body>
</html>
