<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ClawsJoy 离线语音助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .status-card {
            background: #f8f9fa;
            margin: 20px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
        }
        .status-icon { font-size: 48px; margin-bottom: 12px; }
        .status-text { font-size: 18px; font-weight: 500; }
        .status-detail { font-size: 12px; color: #666; margin-top: 8px; }
        .result-card {
            background: #f0f0f0;
            margin: 20px;
            padding: 16px;
            border-radius: 16px;
        }
        .result-text { font-size: 16px; line-height: 1.5; word-break: break-all; }
        .button-group { display: flex; gap: 12px; margin: 20px; }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .log-area {
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 12px;
            margin: 20px;
            border-radius: 12px;
            height: 150px;
            overflow-y: auto;
        }
        .footer { text-align: center; padding: 20px; color: #999; font-size: 11px; }
        .wake-badge { display: inline-block; background: #667eea; color: white; padding: 6px 12px; border-radius: 20px; font-size: 14px; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 ClawsJoy</h1>
            <p>离线语音助手 · 隐私安全</p>
        </div>

        <div class="status-card">
            <div class="status-icon" id="statusIcon">🎤</div>
            <div class="status-text" id="statusText">未启动</div>
            <div class="status-detail" id="statusDetail">点击下方按钮启动</div>
            <div class="wake-badge" id="wakeBadge">⚡ 唤醒词: 你好小管</div>
        </div>

        <div class="result-card">
            <div class="result-text" id="resultText">-</div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="startBtn">▶ 启动监听</button>
            <button class="btn btn-secondary" id="stopBtn">⏹️ 停止</button>
        </div>

        <div class="log-area" id="logArea">[系统] 准备就绪</div>
        <div class="footer">🔒 完全离线 · 不依赖云端 · 隐私安全</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mellon@0.1.0/dist/mellon.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.3.0/dist/vosk.js"></script>
    <script>
        // 离线语音助手
        let mediaStream = null;
        let wakeWordDetector = null;
        let recognizer = null;
        let voskModel = null;
        let isListening = false;
        let isAwakened = false;

        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const statusDetail = document.getElementById('statusDetail');
        const resultText = document.getElementById('resultText');
        const logArea = document.getElementById('logArea');

        function addLog(msg) {
            logArea.innerHTML += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        function updateStatus(icon, text, detail) {
            statusIcon.textContent = icon;
            statusText.textContent = text;
            statusDetail.textContent = detail;
        }

        // 加载 Vosk 模型
        async function loadVoskModel() {
            addLog('📦 加载 Vosk 模型...');
            try {
                voskModel = await Vosk.createModel('/mobile/vosk-model/');
                addLog('✅ Vosk 模型加载完成');
                return true;
            } catch(e) {
                addLog('❌ Vosk 模型加载失败: ' + e.message);
                return false;
            }
        }

        // 初始化唤醒词检测（Mellon）
        async function initWakeWord() {
            if (!window.Mellon) {
                addLog('❌ Mellon 库未加载');
                return false;
            }
            
            // 从 localStorage 加载训练好的模型
            let wakeModel = localStorage.getItem('clawsjoy_wakeword');
            if (!wakeModel) {
                addLog('⚠️ 未找到唤醒词模型，请先训练');
                updateStatus('⚠️', '未训练', '请先训练唤醒词');
                return false;
            }
            
            try {
                wakeModel = JSON.parse(wakeModel);
                wakeWordDetector = new window.Mellon.Detector(wakeModel);
                addLog('✅ 唤醒词模型加载完成');
                return true;
            } catch(e) {
                addLog('❌ 唤醒词模型解析失败');
                return false;
            }
        }

        // 启动监听
        async function startListening() {
            if (isListening) return;
            
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                addLog('✅ 麦克风已授权');
                
                // 加载模型
                await loadVoskModel();
                await initWakeWord();
                
                if (!wakeWordDetector || !voskModel) {
                    addLog('❌ 模型加载失败，无法启动');
                    return;
                }
                
                isListening = true;
                updateStatus('🎤', '监听中', '等待唤醒词 "你好小管"');
                
                // 启动唤醒词检测
                wakeWordDetector.start(mediaStream, (detected) => {
                    if (detected && !isAwakened) {
                        onWake();
                    }
                });
                
                // 初始化 Vosk 识别器（唤醒后使用）
                recognizer = await voskModel.createRecognizer();
                recognizer.onResult = (result) => {
                    const text = result.text;
                    if (text) {
                        addLog(`📝 识别: ${text}`);
                        resultText.textContent = text;
                        callClawsJoy(text);
                        isAwakened = false;
                        updateStatus('🎤', '监听中', '等待唤醒词');
                    }
                };
                
            } catch(e) {
                addLog('❌ 启动失败: ' + e.message);
            }
        }

        function onWake() {
            isAwakened = true;
            addLog('🔔 唤醒成功！');
            updateStatus('🎙️', '已唤醒', '请说话...');
            resultText.textContent = '请说话...';
            if (navigator.vibrate) navigator.vibrate(100);
            
            // 开始识别
            if (recognizer) {
                // Vosk 流式识别需要音频数据
                addLog('🎙️ 开始识别...');
            }
        }

        async function callClawsJoy(text) {
            addLog(`🤖 调用 ClawsJoy: ${text}`);
            try {
                const response = await fetch('/api/agent/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, user_id: 'voice_user' })
                });
                const data = await response.json();
                const reply = data.response || '处理完成';
                addLog(`💬 ClawsJoy: ${reply.substring(0, 100)}`);
                resultText.textContent = reply;
                speak(reply);
            } catch(e) {
                addLog(`❌ 调用失败: ${e.message}`);
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        function stopListening() {
            isListening = false;
            if (wakeWordDetector) wakeWordDetector.stop();
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            updateStatus('⏹️', '已停止', '点击启动');
            addLog('⏹️ 监听已停止');
        }

        document.getElementById('startBtn').onclick = startListening;
        document.getElementById('stopBtn').onclick = stopListening;

        addLog('✅ 页面加载完成');
        addLog('💡 提示：首次使用需要先训练唤醒词');
        addLog('🔗 打开 /mobile/train_wakeword.html 训练"你好小管"');
    </script>
</body>
</html>
