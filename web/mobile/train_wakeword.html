<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>唤醒词训练 - ClawsJoy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            overflow: hidden;
            padding: 24px;
        }
        h1 { font-size: 26px; margin-bottom: 8px; color: #333; }
        .step {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 20px;
            margin: 16px 0;
        }
        .step h3 { margin-bottom: 12px; color: #667eea; font-size: 16px; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 4px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-success { background: #28a745; color: white; }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        .sample-item {
            background: white;
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            border-left: 3px solid #28a745;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: #28a745;
            border-radius: 4px;
            transition: width 0.3s;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #667eea;
            text-decoration: none;
        }
        .note {
            font-size: 12px;
            color: #999;
            margin-top: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 训练唤醒词</h1>
        <p style="color: #666; margin-bottom: 16px;">录制3次，训练专属语音唤醒模型</p>

        <div class="step">
            <h3>📝 1. 设置唤醒词</h3>
            <input type="text" id="wakeWord" placeholder="输入唤醒词" value="你好助手">
            <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;">
                <button class="btn-secondary" onclick="setWakeWord('你好助手')">你好助手</button>
                <button class="btn-secondary" onclick="setWakeWord('嘿爪爪')">嘿爪爪</button>
                <button class="btn-secondary" onclick="setWakeWord('小管同学')">小管同学</button>
                <button class="btn-secondary" onclick="setWakeWord('ClawsJoy')">ClawsJoy</button>
                <button class="btn-secondary" onclick="setWakeWord('嘿Siri')">嘿Siri</button>
            </div>
        </div>

        <div class="step">
            <h3>🎙️ 2. 麦克风权限</h3>
            <button id="requestMicBtn" class="btn-primary">📢 请求麦克风权限</button>
            <div id="micStatus" class="status"></div>
        </div>

        <div class="step">
            <h3>🔴 3. 录制唤醒词 <span id="recordCount">(0/3)</span></h3>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <button id="recordBtn" class="btn-primary" disabled>🎙️ 开始录制</button>
            <button id="resetBtn" class="btn-secondary">🔄 全部重置</button>
            <div id="recordStatus" class="status"></div>
            <div id="sampleList"></div>
        </div>

        <div class="step">
            <h3>💾 4. 保存并测试</h3>
            <button id="saveBtn" class="btn-success" disabled>💾 保存唤醒词模型</button>
            <button id="testBtn" class="btn-primary" disabled>🎤 测试唤醒</button>
            <div id="saveStatus" class="status"></div>
            <div id="testResult" style="display:none;"></div>
        </div>

        <a href="/mobile/" class="back-link">← 返回首页</a>
        <div class="note">💡 测试唤醒使用浏览器语音识别，需要联网。唤醒词模型保存在本地浏览器中。</div>
    </div>

    <script>
        let mediaStream = null;
        let mediaRecorder = null;
        let samples = [];
        let testRecognition = null;

        const wakeWordInput = document.getElementById('wakeWord');
        const requestMicBtn = document.getElementById('requestMicBtn');
        const recordBtn = document.getElementById('recordBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const testBtn = document.getElementById('testBtn');
        const micStatus = document.getElementById('micStatus');
        const recordStatus = document.getElementById('recordStatus');
        const saveStatus = document.getElementById('saveStatus');
        const sampleList = document.getElementById('sampleList');
        const recordCount = document.getElementById('recordCount');
        const testResult = document.getElementById('testResult');
        const progressFill = document.getElementById('progressFill');

        function setWakeWord(word) {
            wakeWordInput.value = word;
        }

        function updateProgress() {
            const percent = (samples.length / 3) * 100;
            progressFill.style.width = percent + '%';
            recordCount.textContent = `(${samples.length}/3)`;
        }

        // 请求麦克风
        requestMicBtn.onclick = async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micStatus.innerHTML = '✅ 麦克风权限已获得！可以开始录制';
                micStatus.className = 'status success';
                recordBtn.disabled = false;
            } catch(e) {
                micStatus.innerHTML = '❌ 麦克风权限被拒绝: ' + e.message;
                micStatus.className = 'status error';
            }
        };

        // 录制音频
        function recordAudio(duration = 3) {
            return new Promise((resolve, reject) => {
                const chunks = [];
                const recorder = new MediaRecorder(mediaStream);
                recorder.ondataavailable = (e) => chunks.push(e.data);
                recorder.onstop = () => resolve(new Blob(chunks, { type: 'audio/wav' }));
                recorder.onerror = reject;
                recorder.start();
                setTimeout(() => {
                    if (recorder.state === 'recording') recorder.stop();
                }, duration * 1000);
            });
        }

        // 录制唤醒词
        recordBtn.onclick = async () => {
            if (samples.length >= 3) {
                recordStatus.innerHTML = '✅ 已完成3次录制，请保存模型';
                return;
            }
            
            const wakeWord = wakeWordInput.value.trim();
            if (!wakeWord) {
                recordStatus.innerHTML = '⚠️ 请先输入唤醒词';
                recordStatus.className = 'status warning';
                return;
            }
            
            recordStatus.innerHTML = `🔴 录音中 (${samples.length + 1}/3) 请说: "${wakeWord}"`;
            recordStatus.className = 'status info';
            recordBtn.disabled = true;
            
            try {
                const audioBlob = await recordAudio(3);
                const reader = new FileReader();
                reader.onloadend = () => {
                    samples.push({ audio: reader.result, word: wakeWord, timestamp: Date.now() });
                    
                    const div = document.createElement('div');
                    div.className = 'sample-item';
                    div.innerHTML = `
                        <span>✅ 样本 ${samples.length}: "${wakeWord}"</span>
                        <button onclick="playSample(${samples.length - 1})" style="padding: 4px 12px;">▶️ 播放</button>
                    `;
                    sampleList.appendChild(div);
                    updateProgress();
                    
                    if (samples.length >= 3) {
                        recordStatus.innerHTML = '✅ 3次录制完成！点击"保存唤醒词模型"';
                        recordStatus.className = 'status success';
                        recordBtn.disabled = true;
                        saveBtn.disabled = false;
                    } else {
                        recordStatus.innerHTML = `✅ 第 ${samples.length} 次完成，继续录制第 ${samples.length + 1} 次`;
                        recordStatus.className = 'status success';
                        recordBtn.disabled = false;
                    }
                };
                reader.readAsDataURL(audioBlob);
            } catch(e) {
                recordStatus.innerHTML = '❌ 录制失败: ' + e.message;
                recordStatus.className = 'status error';
                recordBtn.disabled = false;
            }
        };

        window.playSample = (index) => {
            const sample = samples[index];
            if (sample && sample.audio) {
                const audio = new Audio(sample.audio);
                audio.play();
            }
        };

        // 重置
        resetBtn.onclick = () => {
            samples = [];
            sampleList.innerHTML = '';
            updateProgress();
            recordBtn.disabled = false;
            saveBtn.disabled = true;
            testBtn.disabled = true;
            recordStatus.innerHTML = '🔄 已重置，可重新录制';
            recordStatus.className = 'status info';
            saveStatus.innerHTML = '';
            testResult.style.display = 'none';
            localStorage.removeItem('clawsjoy_wakeword_model');
        };

        // 保存模型
        saveBtn.onclick = () => {
            const wakeWord = wakeWordInput.value.trim();
            const model = { wakeWord, samples, created: new Date().toISOString() };
            localStorage.setItem('clawsjoy_wakeword_model', JSON.stringify(model));
            saveStatus.innerHTML = `✅ 唤醒词 "${wakeWord}" 模型已保存！共 ${samples.length} 个样本`;
            saveStatus.className = 'status success';
            testBtn.disabled = false;
        };

        // 测试唤醒
        function startWakeWordTest() {
            const saved = localStorage.getItem('clawsjoy_wakeword_model');
            if (!saved) {
                testResult.innerHTML = '<div class="status error">请先训练并保存唤醒词模型</div>';
                testResult.style.display = 'block';
                return;
            }
            
            const model = JSON.parse(saved);
            const wakeWord = model.wakeWord.toLowerCase();
            
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                testResult.innerHTML = '<div class="status error">当前浏览器不支持语音识别，请使用Chrome</div>';
                testResult.style.display = 'block';
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            testRecognition = new SpeechRecognition();
            testRecognition.continuous = true;
            testRecognition.interimResults = true;
            testRecognition.lang = 'zh-CN';
            
            testRecognition.onstart = () => {
                testResult.innerHTML = `
                    <div style="text-align:center; padding:12px; background:#e8e8e8; border-radius:12px;">
                        🎤 正在监听 "${wakeWord}" ...<br>
                        <button onclick="stopWakeWordTest()" class="btn-secondary" style="margin-top:8px;">停止测试</button>
                    </div>
                    <div id="testTranscript" style="margin-top:8px; color:#666; text-align:center;"></div>
                `;
                testResult.style.display = 'block';
            };
            
            testRecognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                const td = document.getElementById('testTranscript');
                if (td) td.innerHTML = `🎙️ 识别: "${transcript}"`;
                
                if (transcript.toLowerCase().includes(wakeWord)) {
                    testResult.innerHTML = `<div class="status success" style="text-align:center;">🎉 唤醒成功！检测到 "${wakeWord}" 🎉</div>`;
                    if (testRecognition) testRecognition.stop();
                }
            };
            
            testRecognition.onerror = (event) => {
                testResult.innerHTML = `<div class="status error">错误: ${event.error}</div>`;
            };
            
            testRecognition.start();
        }
        
        function stopWakeWordTest() {
            if (testRecognition) {
                testRecognition.stop();
                testRecognition = null;
            }
            testResult.style.display = 'none';
        }
        
        testBtn.onclick = () => {
            if (testRecognition) {
                stopWakeWordTest();
            } else {
                startWakeWordTest();
            }
        };
        
        // 页面加载时检查已保存的模型
        const savedModel = localStorage.getItem('clawsjoy_wakeword_model');
        if (savedModel) {
            try {
                const model = JSON.parse(savedModel);
                wakeWordInput.value = model.wakeWord;
                saveStatus.innerHTML = `📦 已有保存的模型: "${model.wakeWord}" (${model.samples?.length || 0}个样本)`;
                saveStatus.className = 'status info';
                testBtn.disabled = false;
                
                if (model.samples && model.samples.length > 0) {
                    samples = model.samples;
                    sampleList.innerHTML = '';
                    samples.forEach((s, i) => {
                        const div = document.createElement('div');
                        div.className = 'sample-item';
                        div.innerHTML = `
                            <span>✅ 样本 ${i+1}: "${s.word}"</span>
                            <button onclick="playSample(${i})" style="padding:4px 12px;">▶️ 播放</button>
                        `;
                        sampleList.appendChild(div);
                    });
                    updateProgress();
                    if (samples.length >= 3) saveBtn.disabled = false;
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
