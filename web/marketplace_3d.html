<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ClawsJoy 3D Agent市场 | 科幻风格</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            color: #e0e0e0;
        }

        /* Canvas 3D背景 */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 主内容区域 - 环抱式布局 */
        .main-content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 头部 - 全息投影效果 */
        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 26, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 32px;
            filter: drop-shadow(0 0 10px #00f3ff);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 5px #00f3ff; }
            50% { text-shadow: 0 0 20px #00f3ff, 0 0 30px #7b2ff7; }
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #00f3ff, #7b2ff7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .logo-sub {
            font-size: 12px;
            color: #00f3ff;
            opacity: 0.7;
            margin-left: 10px;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .user-id {
            font-size: 14px;
            color: #00f3ff;
        }

        .user-id input {
            background: rgba(10, 10, 26, 0.8);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 4px 12px;
            border-radius: 20px;
            width: 120px;
            font-size: 12px;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #00f3ff, #7b2ff7);
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-refresh:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        /* 环抱式布局 - 左右弧形边栏 + 中央内容 */
        .hug-layout {
            display: flex;
            flex: 1;
            padding: 20px 30px;
            gap: 25px;
            overflow: hidden;
        }

        /* 左侧 - 树形目录 (可拓展架构) */
        .tree-sidebar {
            width: 280px;
            background: rgba(10, 10, 26, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            transition: all 0.3s;
            position: relative;
        }

        .tree-sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f3ff, #7b2ff7, transparent);
        }

        .tree-title {
            font-size: 16px;
            color: #00f3ff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 12px;
        }

        /* 树形目录样式 */
        .tree-node {
            margin: 8px 0;
        }

        .tree-node-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            color: #ccc;
        }

        .tree-node-header:hover {
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
        }

        .tree-node-header.active {
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(123, 47, 247, 0.15));
            color: #00f3ff;
            border-left: 2px solid #00f3ff;
        }

        .tree-icon {
            font-size: 18px;
            width: 24px;
        }

        .tree-label {
            flex: 1;
            font-size: 14px;
        }

        .tree-count {
            font-size: 11px;
            color: #666;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 20px;
        }

        .tree-children {
            margin-left: 32px;
            display: none;
        }

        .tree-children.open {
            display: block;
        }

        /* 右侧 - 产品展示区 (弧形滚动) */
        .products-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* 滚动条样式 */
        .products-area::-webkit-scrollbar {
            width: 6px;
        }

        .products-area::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .products-area::-webkit-scrollbar-thumb {
            background: #00f3ff;
            border-radius: 10px;
        }

        /* 产品网格 - 科幻卡片 */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: rgba(26, 26, 46, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #00f3ff;
            box-shadow: 0 10px 40px rgba(0, 243, 255, 0.2);
        }

        .product-card:hover::before {
            left: 100%;
        }

        .product-icon {
            font-size: 48px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.5));
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .product-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            background: linear-gradient(135deg, #00f3ff20, #7b2ff720);
            color: #00f3ff;
        }

        .product-desc {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
            margin: 10px 0;
            height: 40px;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .product-version {
            font-size: 11px;
            color: #666;
        }

        .btn-install {
            background: linear-gradient(135deg, #00f3ff, #7b2ff7);
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-install:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .btn-installed {
            background: rgba(0, 243, 255, 0.2);
            color: #00f3ff;
            cursor: default;
            border: 1px solid #00f3ff;
        }

        .btn-uninstall {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        /* 底部统计栏 */
        .stats-bar {
            padding: 15px 40px;
            background: rgba(10, 10, 26, 0.6);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            display: flex;
            gap: 30px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .stat-value {
            color: #00f3ff;
            font-size: 20px;
            font-weight: bold;
        }

        /* 弹板详情页 */
        .detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s;
        }

        .detail-modal.active {
            visibility: visible;
            opacity: 1;
        }

        .detail-panel {
            width: 500px;
            max-width: 90%;
            background: linear-gradient(135deg, #1a1a2e, #0a0a1a);
            border-radius: 32px;
            border: 1px solid #00f3ff;
            padding: 30px;
            transform: scale(0.9);
            transition: transform 0.3s;
            position: relative;
        }

        .detail-modal.active .detail-panel {
            transform: scale(1);
        }

        .detail-panel h2 {
            color: #00f3ff;
            margin-bottom: 20px;
        }

        .detail-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }

        /* Toast提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1a2e;
            border: 1px solid #00f3ff;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 1100;
            animation: fadeInOut 2s ease;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="main-content">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🌀</div>
                <div class="logo-text">ClawsJoy</div>
                <div class="logo-sub">v5.0 · AGENT MARKET</div>
            </div>
            <div class="user-panel">
                <span class="user-id">👤</span>
                <input type="text" id="userId" value="default" placeholder="用户ID">
                <button class="btn-refresh" onclick="loadAllData()">⟳ 刷新</button>
            </div>
        </div>

        <div class="hug-layout">
            <!-- 左侧树形目录 -->
            <div class="tree-sidebar">
                <div class="tree-title">
                    <span>📂</span> 智能体目录
                    <span style="font-size: 11px; color: #666;">可拓展架构</span>
                </div>
                <div id="tree-container">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- 右侧产品展示区 -->
            <div class="products-area">
                <div id="products-grid" class="products-grid">
                    <div class="loading">🌀 加载产品中...</div>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">📦 产品总数 <span class="stat-value" id="stat-total">0</span></div>
            <div class="stat-item">🤖 Agent <span class="stat-value" id="stat-agents">0</span></div>
            <div class="stat-item">⚡ 技能 <span class="stat-value" id="stat-skills">0</span></div>
            <div class="stat-item">✅ 已安装 <span class="stat-value" id="stat-installed">0</span></div>
        </div>
    </div>

    <!-- 弹板详情 -->
    <div id="detailModal" class="detail-modal">
        <div class="detail-panel">
            <button class="detail-close" onclick="closeDetail()">✕</button>
            <div id="detail-content"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ========== Three.js 3D背景 ==========
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        // 粒子系统
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        
        for (let i = 0; i < particlesCount * 3; i += 3) {
            posArray[i] = (Math.random() - 0.5) * 100;
            posArray[i+1] = (Math.random() - 0.5) * 60;
            posArray[i+2] = (Math.random() - 0.5) * 50 - 20;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.15,
            color: 0x00f3ff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        
        // 旋转环
        const ringGeometry = new THREE.TorusGeometry(8, 0.08, 64, 500);
        const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.3 });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        scene.add(ring);
        
        const ring2Geometry = new THREE.TorusGeometry(12, 0.05, 64, 500);
        const ring2Material = new THREE.MeshBasicMaterial({ color: 0x7b2ff7, transparent: true, opacity: 0.3 });
        const ring2 = new THREE.Mesh(ring2Geometry, ring2Material);
        scene.add(ring2);
        
        // 中心光晕
        const ambientLight = new THREE.AmbientLight(0x111122);
        scene.add(ambientLight);
        
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;
            
            particlesMesh.rotation.y = time * 0.05;
            particlesMesh.rotation.x = Math.sin(time * 0.1) * 0.1;
            
            ring.rotation.x = Math.sin(time * 0.2) * 0.3;
            ring.rotation.y = time * 0.1;
            ring2.rotation.x = Math.cos(time * 0.15) * 0.2;
            ring2.rotation.z = time * 0.08;
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ========== API 调用 ==========
        const API_BASE = 'http://localhost:5002';
        let allProducts = [];
        let installedAgents = [];
        let currentFilter = 'all';
        
        // 树形目录数据
        const treeData = {
            name: 'root',
            children: [
                { name: '全部', icon: '🌌', type: 'all', count: 0 },
                { name: '🤖 Agent', icon: '🤖', type: 'agent', count: 0 },
                { name: '⚡ 技能', icon: '⚡', type: 'skill', count: 0 },
                { name: '🎨 皮肤', icon: '🎨', type: 'skin', count: 0, disabled: true },
                { name: '🎤 语音', icon: '🎤', type: 'voice', count: 0, disabled: true }
            ]
        };
        
        function getUserId() {
            return document.getElementById('userId').value || 'default';
        }
        
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderColor = isError ? '#ff4444' : '#00f3ff';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/api/marketplace/list`);
                const data = await response.json();
                if (data.products) {
                    allProducts = data.products;
                    document.getElementById('stat-total').textContent = allProducts.length;
                    document.getElementById('stat-agents').textContent = allProducts.filter(p => p.type === 'agent').length;
                    document.getElementById('stat-skills').textContent = allProducts.filter(p => p.type === 'skill').length;
                    
                    // 更新树形目录计数
                    treeData.children[0].count = allProducts.length;
                    treeData.children[1].count = allProducts.filter(p => p.type === 'agent').length;
                    treeData.children[2].count = allProducts.filter(p => p.type === 'skill').length;
                    renderTree();
                    
                    renderProducts();
                }
            } catch (error) {
                console.error('加载产品失败:', error);
                document.getElementById('products-grid').innerHTML = '<div class="loading">❌ 连接后端失败，请确保服务已启动</div>';
            }
        }
        
        async function loadInstalled() {
            const userId = getUserId();
            try {
                const response = await fetch(`${API_BASE}/api/marketplace/installed?user_id=${userId}`);
                const data = await response.json();
                installedAgents = data.agents || [];
                document.getElementById('stat-installed').textContent = installedAgents.length;
                renderProducts();
            } catch (error) {
                console.error('加载已安装列表失败:', error);
            }
        }
        
        function isInstalled(productId) {
            return installedAgents.some(a => a.id === productId || a.name === productId);
        }
        
        async function installProduct(productId, productName) {
            const userId = getUserId();
            try {
                const response = await fetch(`${API_BASE}/api/marketplace/install`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, product_id: productId })
                });
                const data = await response.json();
                if (data.success) {
                    showToast(`✅ 安装成功: ${productName}`);
                    await loadInstalled();
                } else {
                    showToast(`❌ 安装失败: ${data.error || '未知错误'}`, true);
                }
            } catch (error) {
                showToast(`❌ 安装失败: ${error.message}`, true);
            }
        }
        
        async function uninstallProduct(agentId, agentName) {
            const userId = getUserId();
            try {
                const response = await fetch(`${API_BASE}/api/marketplace/uninstall`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, agent_id: agentId })
                });
                const data = await response.json();
                if (data.success) {
                    showToast(`🗑️ 已卸载: ${agentName}`);
                    await loadInstalled();
                } else {
                    showToast(`❌ 卸载失败: ${data.error || '未知错误'}`, true);
                }
            } catch (error) {
                showToast(`❌ 卸载失败: ${error.message}`, true);
            }
        }
        
        function renderProducts() {
            let filtered = allProducts;
            if (currentFilter !== 'all') {
                filtered = allProducts.filter(p => p.type === currentFilter);
            }
            
            if (filtered.length === 0) {
                document.getElementById('products-grid').innerHTML = '<div class="loading">✨ 暂无产品</div>';
                return;
            }
            
            document.getElementById('products-grid').innerHTML = filtered.map(product => {
                const installed = isInstalled(product.id);
                const buttonHtml = installed 
                    ? `<button class="btn-installed" disabled>✅ 已安装</button>`
                    : `<button class="btn-install" onclick="installProduct('${product.id}', '${product.name}')">📥 安装</button>`;
                
                return `
                    <div class="product-card" onclick="showDetail('${product.id}')">
                        <div class="product-icon">${product.type === 'agent' ? '🤖' : '⚡'}</div>
                        <div class="product-name">
                            ${escapeHtml(product.name || product.id)}
                            <span class="product-badge">${product.type === 'agent' ? 'Agent' : 'Skill'}</span>
                        </div>
                        <div class="product-desc">${escapeHtml((product.description || '暂无描述').substring(0, 80))}</div>
                        <div class="product-footer">
                            <span class="product-version">v${product.version || '1.0'}</span>
                            ${buttonHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderTree() {
            const html = `
                <div class="tree-node">
                    ${treeData.children.map(node => `
                        <div class="tree-node">
                            <div class="tree-node-header ${currentFilter === node.type ? 'active' : ''}" onclick="filterByType('${node.type}')">
                                <span class="tree-icon">${node.icon}</span>
                                <span class="tree-label">${node.name}</span>
                                <span class="tree-count">${node.count}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(0,243,255,0.1);">
                    <div class="tree-node-header" style="opacity:0.6;">
                        <span class="tree-icon">🔧</span>
                        <span class="tree-label">开发中...</span>
                    </div>
                </div>
            `;
            document.getElementById('tree-container').innerHTML = html;
        }
        
        function filterByType(type) {
            currentFilter = type;
            renderTree();
            renderProducts();
        }
        
        function showDetail(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            
            const installed = isInstalled(productId);
            const modal = document.getElementById('detailModal');
            document.getElementById('detail-content').innerHTML = `
                <h2>${product.icon || (product.type === 'agent' ? '🤖' : '⚡')} ${escapeHtml(product.name)}</h2>
                <p style="margin: 15px 0; line-height: 1.6;">${escapeHtml(product.description || '暂无详细描述')}</p>
                <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; margin: 15px 0;">
                    <div>📌 类型: ${product.type === 'agent' ? '智能Agent' : '可复用技能'}</div>
                    <div>📦 版本: v${product.version || '1.0.0'}</div>
                    <div>👤 作者: ${product.author || 'ClawsJoy'}</div>
                    <div>⭐ 热度: ${product.popularity || 0}</div>
                </div>
                ${installed 
                    ? `<button class="btn-uninstall" style="width:100%; padding:12px;" onclick="uninstallProduct('${product.id}', '${product.name}'); closeDetail();">🗑️ 卸载</button>`
                    : `<button class="btn-install" style="width:100%; padding:12px;" onclick="installProduct('${product.id}', '${product.name}'); closeDetail();">📥 安装到我的工作区</button>`
                }
            `;
            modal.classList.add('active');
        }
        
        function closeDetail() {
            document.getElementById('detailModal').classList.remove('active');
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function loadAllData() {
            await loadProducts();
            await loadInstalled();
        }
        
        // 初始化
        loadAllData();
        
        // 点击模态框外部关闭
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetail();
        });
    </script>
</body>
</html>
