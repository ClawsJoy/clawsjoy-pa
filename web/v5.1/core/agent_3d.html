<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Agent</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a1a;
            font-family: 'Segoe UI', monospace;
        }
        .info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: #00f3ff;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
        }
        .status {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #44ff44;
            font-size: 11px;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="info">🐾 ClawsJoy · 智能核心</div>
    <div class="status">● 在线</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.02);
        
        // 相机
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 3.5);
        camera.lookAt(0, 0.8, 0);
        
        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.enableZoom = true;
        controls.target.set(0, 0.8, 0);
        
        // 灯光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(2, 5, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const backLight = new THREE.DirectionalLight(0x4466ff, 0.5);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        
        const colorLight1 = new THREE.PointLight(0x00f3ff, 0.5);
        colorLight1.position.set(2, 1, 2);
        scene.add(colorLight1);
        
        const colorLight2 = new THREE.PointLight(0xb000ff, 0.5);
        colorLight2.position.set(-2, 1, 2);
        scene.add(colorLight2);
        
        // 地面网格
        const gridHelper = new THREE.GridHelper(6, 20, 0x00f3ff, 0x3366aa);
        gridHelper.position.y = -0.6;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);
        
        // 光环
        const ringGeo = new THREE.TorusGeometry(0.8, 0.04, 32, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.4 });
        const groundRing = new THREE.Mesh(ringGeo, ringMat);
        groundRing.position.y = -0.55;
        groundRing.rotation.x = Math.PI / 2;
        scene.add(groundRing);
        
        // 创建角色
        const character = new THREE.Group();
        
        // 身体
        const bodyGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.85, 32);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, metalness: 0.6, roughness: 0.3, emissive: 0x004466, emissiveIntensity: 0.2 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = -0.2;
        body.castShadow = true;
        character.add(body);
        
        // 头部
        const headGeo = new THREE.SphereGeometry(0.48, 64, 64);
        const headMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, metalness: 0.4, roughness: 0.2, emissive: 0x00f3ff, emissiveIntensity: 0.1 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 0.38;
        head.castShadow = true;
        character.add(head);
        
        // 眼睛
        const eyeWhiteGeo = new THREE.SphereGeometry(0.1, 32, 32);
        const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const leftEye = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
        leftEye.position.set(-0.18, 0.52, 0.48);
        character.add(leftEye);
        
        const rightEye = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
        rightEye.position.set(0.18, 0.52, 0.48);
        character.add(rightEye);
        
        // 瞳孔
        const pupilGeo = new THREE.SphereGeometry(0.06, 32, 32);
        const pupilMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
        leftPupil.position.set(-0.18, 0.5, 0.58);
        character.add(leftPupil);
        
        const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
        rightPupil.position.set(0.18, 0.5, 0.58);
        character.add(rightPupil);
        
        // 光环
        const haloGeo = new THREE.TorusGeometry(0.55, 0.06, 32, 100);
        const haloMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.5 });
        const halo = new THREE.Mesh(haloGeo, haloMat);
        halo.position.y = 0.85;
        halo.rotation.x = Math.PI / 2;
        character.add(halo);
        
        scene.add(character);
        
        // 粒子效果
        const particleCount = 50;
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
            const pGeo = new THREE.SphereGeometry(0.04, 8, 8);
            const pMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.5 });
            const particle = new THREE.Mesh(pGeo, pMat);
            particle.userData = {
                angle: (i / particleCount) * Math.PI * 2,
                radius: 0.9,
                speed: 0.02 + Math.random() * 0.02,
                yOffset: (Math.random() - 0.5) * 1.2
            };
            character.add(particle);
            particles.push(particle);
        }
        
        // 星空
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 80;
            starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.5 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // 动画
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            // 角色浮动
            character.position.y = Math.sin(time * 2) * 0.03;
            
            // 光环旋转
            halo.rotation.z = time * 1.5;
            halo.rotation.y = time;
            
            // 粒子环绕
            particles.forEach(particle => {
                const data = particle.userData;
                const x = Math.cos(time * data.speed * 4 + data.angle) * data.radius;
                const z = Math.sin(time * data.speed * 4 + data.angle) * data.radius;
                particle.position.set(x, data.yOffset + Math.sin(time * 2) * 0.05, z);
            });
            
            // 动态灯光
            colorLight1.intensity = 0.5 + Math.sin(time) * 0.2;
            colorLight2.intensity = 0.5 + Math.cos(time * 1.3) * 0.2;
            
            // 星空旋转
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            groundRing.rotation.z += 0.01;
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
        
        // 窗口适配
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
<script>function goToStore(){localStorage.clear();window.location.href="../marketplace.html";}</script>
</body>
</html>
