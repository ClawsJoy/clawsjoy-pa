name: Docker Build

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - requirements.txt
      - .dockerignore

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t clawsjoy-gateway:ci .

      - name: Inspect image
        run: docker image inspect clawsjoy-gateway:ci --format '{{.Id}} {{.Size}}'
