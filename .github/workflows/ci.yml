name: CI Gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  changed-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint deps only
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.8 black==26.5.1

      - name: Lint changed Python files
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD^"; fi
          FILES="$(git diff --name-only "$BASE"...HEAD -- '*.py' | tr '\n' ' ')"
          echo "changed Python: $FILES"
          if [ -n "$FILES" ]; then
            ruff check $FILES
            black --check $FILES
          else
            echo "no Python changes; lint gate skipped"
          fi

  pa-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: PA gate tests (environment-independent)
        run: |
          # test_real_* require a live local gateway/vault; keep them in local/manual integration.
          python -m pytest -q -k "not real" \
            tests/unit/test_pa_relations_status.py \
            tests/unit/test_pa_verify_legacy_route.py \
            tests/unit/test_pa_legacy_verify_face.py \
            tests/unit/test_pa_preflight.py

  legacy-advisory:
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Full legacy ruff (advisory)
        run: ruff check . --exclude tools/archive,old,models,data || true

      - name: Full legacy black (advisory)
        run: black --check . --exclude "tools/archive|old|models|data" || true

      - name: Full legacy tests (advisory)
        run: python -m pytest tests/ -q --ignore=tests/tests || true
